name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  banco:
    name: Banco (migrations + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dicionário de dados atualizado
        run: |
          npm run dicionario -w @cc/db
          git diff --exit-code docs/DICIONARIO_DE_DADOS.md
      - name: Dependências sem vulnerabilidade alta
        run: npm audit --audit-level=high

  agente-local:
    name: Agente local (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest -q

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks lista os commits do PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
