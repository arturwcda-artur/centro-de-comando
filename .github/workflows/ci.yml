name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dicionário de dados atualizado
        run: |
          npm run dicionario -w @cc/db
          git diff --exit-code docs/DICIONARIO_DE_DADOS.md
