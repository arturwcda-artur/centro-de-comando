name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  banco:
    name: Banco (migrations + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dicionário de dados atualizado
        run: |
          npm run dicionario -w @cc/db
          git diff --exit-code docs/DICIONARIO_DE_DADOS.md
      - name: Dependências sem vulnerabilidade alta
        run: npm audit --audit-level=high

  web:
    name: Aplicação web (tipos, lint, testes, build)
    runs-on: ubuntu-latest
    env:
      # Valores fictícios só para o build; a aplicação real usa as variáveis da Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-publica-de-exemplo
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
        working-directory: apps/web
      - run: npm run typecheck -w @cc/web
      - run: npm run lint -w @cc/web
      - run: npm run test -w @cc/web
      - run: npm run build -w @cc/web

  agente-local:
    name: Agente local (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pytest openpyxl
      - run: pytest -q

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks lista os commits do PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
